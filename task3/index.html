<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineDeck - Task 3: Poster Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-content">
      <h1>CineDeck</h1>

      <p class="section-lead">Gallery of Poster</p>

      <section class="gallery">
        <div class="gallery-item">
          <img src="images/avengers-endgame.svg" alt="Avengers Poster" />
          <div class="gallery-caption">Avengers: Endgame</div>
        </div>

        <div class="gallery-item">
          <img src="images/fall-2.svg" />
          <div class="gallery-caption">Fall 2: Deadpoint</div>
        </div>

        <div class="gallery-item">
          <img src="images/7-qarakshy.svg" />
          <div class="gallery-caption">7 Қарақшы</div>
        </div>

        <div class="gallery-item">
          <img src="images/solar-drift.svg" />
          <div class="gallery-caption">Solar Drift</div>
        </div>

        <div class="gallery-item">
          <img src="images/midnight-ember.svg" />
          <div class="gallery-caption">Midnight Ember</div>
        </div>

        <div class="gallery-item">
          <img src="images/the-last-cartographer.svg" />
          <div class="gallery-caption">The Last Cartographer</div>
        </div>

        <div class="gallery-item">
          <img src="images/northern-static.svg" />
          <div class="gallery-caption">Northern Static</div>
        </div>

        <div class="gallery-item">
          <img src="images/glass-horizon.svg" />
          <div class="gallery-caption">Glass Horizon</div>
        </div>

        <div class="gallery-item">
          <img src="images/paper-tigers.svg" />
          <div class="gallery-caption">Paper Tigers</div>
        </div>
      </section>
    </main>
  </body>
</html>
