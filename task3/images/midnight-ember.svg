  <text x="24" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#ffffff">Midnight</text>
  <text x="24" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#ffffff">Ember</text>
